<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IER • ELITE VIII</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         HEADER CSS
    ====================================================== -->

    <style>

        /* =====================================================
           ROOT
        ====================================================== */

        :root {

            --cream: #f5f0e6;

            --cream-soft: #eee7d8;

            --burgundy: #641c2b;

            --burgundy-dark: #43121d;

            --burgundy-light: #7b2939;

            --text-dark: #24191b;

            --text-soft: #66575a;

            --border-soft: rgba(100, 28, 43, 0.18);

        }



        /* =====================================================
           RESET
        ====================================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            background: var(--cream);

            color: var(--text-dark);

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            min-height: 100vh;

        }



        /* =====================================================
           HEADER
        ====================================================== */

        .site-header {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 82px;

            background:
                rgba(245, 240, 230, 0.94);

            border-bottom:
                1px solid var(--border-soft);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            z-index: 1000;

            transition:
                height 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;

        }



        /* Header after scrolling */

        .site-header.scrolled {

            height: 70px;

            background:
                rgba(245, 240, 230, 0.98);

            box-shadow:
                0 8px 30px
                rgba(67, 18, 29, 0.08);

        }



        /* =====================================================
           NAV CONTAINER
        ====================================================== */

        .nav-container {

            width: min(1240px, 92%);

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }



        /* =====================================================
           BRAND
        ====================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 13px;

            text-decoration: none;

            color: var(--text-dark);

        }



        /* Roman VIII Circle */

        .brand-mark {

            width: 48px;

            height: 48px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1.5px solid var(--burgundy);

            border-radius: 50%;

            color: var(--burgundy);

            font-family:
                "Playfair Display",
                Georgia,
                serif;

            font-size: 17px;

            font-weight: 700;

            letter-spacing: 1px;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;

        }



        /* Brand hover */

        .brand:hover .brand-mark {

            background: var(--burgundy);

            color: var(--cream);

            transform:
                rotate(-5deg);

        }



        /* =====================================================
           BRAND TEXT
        ====================================================== */

        .brand-text {

            display: flex;

            flex-direction: column;

            gap: 4px;

        }



        .brand-main {

            color: var(--burgundy);

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 1.5px;

            line-height: 1;

        }



        .brand-sub {

            color: #806c6f;

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 7px;

            font-weight: 600;

            letter-spacing: 1.45px;

            line-height: 1.3;

            white-space: nowrap;

        }



        /* =====================================================
           DESKTOP NAVIGATION
        ====================================================== */

        .main-nav {

            display: flex;

            align-items: center;

            gap: 7px;

        }



        .nav-link {

            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 10px 17px;

            color: #4e4143;

            text-decoration: none;

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1px;

            transition:
                color 0.3s ease,
                background 0.3s ease;

        }



        /* =====================================================
           NAV UNDERLINE
        ====================================================== */

        .nav-link::after {

            content: "";

            position: absolute;

            left: 17px;

            right: 17px;

            bottom: 3px;

            height: 2px;

            background:
                var(--burgundy);

            transform:
                scaleX(0);

            transform-origin:
                center;

            transition:
                transform 0.3s ease;

        }



        .nav-link:hover {

            color:
                var(--burgundy);

        }



        .nav-link:hover::after {

            transform:
                scaleX(1);

        }



        /* =====================================================
           ACTIVE NAVIGATION
        ====================================================== */

        .nav-link.active {

            color:
                var(--cream);

            background:
                var(--burgundy);

            border-radius:
                30px;

            padding-left: 20px;

            padding-right: 20px;

        }



        .nav-link.active::after {

            display: none;

        }



        /* =====================================================
           MOBILE MENU BUTTON
        ====================================================== */

        .menu-toggle {

            display: none;

            width: 44px;

            height: 44px;

            padding: 0;

            border:
                1px solid var(--border-soft);

            border-radius: 50%;

            background:
                transparent;

            cursor: pointer;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 5px;

        }



        .menu-toggle span {

            display: block;

            width: 18px;

            height: 2px;

            background:
                var(--burgundy);

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;

        }



        /* =====================================================
           MOBILE MENU ANIMATION
        ====================================================== */

        .menu-toggle.active span:nth-child(1) {

            transform:
                translateY(7px)
                rotate(45deg);

        }


        .menu-toggle.active span:nth-child(2) {

            opacity: 0;

        }


        .menu-toggle.active span:nth-child(3) {

            transform:
                translateY(-7px)
                rotate(-45deg);

        }



        /* =====================================================
           MOBILE NAVIGATION
        ====================================================== */

        @media (max-width: 900px) {


            .site-header {

                height: 74px;

            }



            .nav-container {

                width: 90%;

            }



            .brand-mark {

                width: 43px;

                height: 43px;

                font-size: 15px;

            }



            .brand-main {

                font-size: 13px;

            }



            .brand-sub {

                font-size: 6px;

            }



            /* Show hamburger */

            .menu-toggle {

                display: flex;

            }



            /* Mobile navigation */

            .main-nav {

                position: absolute;

                top: 74px;

                left: 0;

                width: 100%;

                padding:
                    15px 5% 20px;

                background:
                    rgba(245, 240, 230, 0.98);

                backdrop-filter:
                    blur(16px);

                -webkit-backdrop-filter:
                    blur(16px);

                border-bottom:
                    1px solid var(--border-soft);

                display: flex;

                flex-direction: column;

                align-items: stretch;

                gap: 4px;

                opacity: 0;

                visibility: hidden;

                transform:
                    translateY(-10px);

                transition:
                    opacity 0.3s ease,
                    visibility 0.3s ease,
                    transform 0.3s ease;

            }



            /* Open mobile menu */

            .main-nav.open {

                opacity: 1;

                visibility: visible;

                transform:
                    translateY(0);

            }



            .nav-link {

                width: 100%;

                justify-content:
                    flex-start;

                padding:
                    13px 18px;

                border-radius: 8px;

            }



            .nav-link.active {

                padding-left: 18px;

                padding-right: 18px;

                border-radius: 8px;

            }



            .nav-link::after {

                display: none;

            }

        }



        /* =====================================================
           SMALL PHONES
        ====================================================== */

        @media (max-width: 480px) {


            .brand-sub {

                display: none;

            }



            .brand-main {

                font-size: 12px;

                letter-spacing: 1px;

            }



            .brand-mark {

                width: 40px;

                height: 40px;

                font-size: 14px;

            }

        }

    </style>

</head>



<body>


    <!-- =====================================================
         HEADER / NAVBAR
    ====================================================== -->

    <header
        class="site-header"
        id="siteHeader"
    >

        <div class="nav-container">


            <!-- =================================================
                 BRAND / LOGO
            ================================================== -->

            <a
                href="#home"
                class="brand"
            >

                <div class="brand-mark">
                    VIII
                </div>


                <div class="brand-text">

                    <span class="brand-main">
                        IER • ELITE VIII
                    </span>

                    <span class="brand-sub">
                        A STORY SINCE SEPTEMBER 25, 2023
                    </span>

                </div>

            </a>



            <!-- =================================================
                 DESKTOP NAVIGATION
            ================================================== -->

            <nav
                class="main-nav"
                id="mainNav"
            >

                <a
                    href="#home"
                    class="nav-link active"
                >
                    HOME
                </a>


                <a
                    href="#story"
                    class="nav-link"
                >
                    OUR BATCH
                </a>


                <a
                    href="#members"
                    class="nav-link"
                >
                    MEMBERS
                </a>


                <a
                    href="#memories"
                    class="nav-link"
                >
                    MEMORIES
                </a>


                <a
                    href="#achievements"
                    class="nav-link"
                >
                    ACHIEVEMENTS
                </a>

            </nav>



            <!-- =================================================
                 MOBILE MENU BUTTON
            ================================================== -->

            <button
                class="menu-toggle"
                id="menuToggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >

                <span></span>

                <span></span>

                <span></span>

            </button>


        </div>

    </header>



    <!-- =====================================================
         TEMPORARY SPACE
         Hero will come here next
    ====================================================== -->

    <main id="home">

        <div
            style="
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Montserrat, sans-serif;
                color: #641c2b;
                text-align: center;
            "
        >

            <div>

                <h1
                    style="
                        font-family: 'Playfair Display', serif;
                        font-size: clamp(40px, 7vw, 90px);
                        margin-bottom: 10px;
                    "
                >
                    ELITE VIII
                </h1>

                <p>
                    Hero section will be added here.
                </p>

            </div>

        </div>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           GET ELEMENTS
        ====================================================== */

        const siteHeader =
            document.getElementById("siteHeader");

        const menuToggle =
            document.getElementById("menuToggle");

        const mainNav =
            document.getElementById("mainNav");



        /* =====================================================
           HEADER SCROLL EFFECT
        ====================================================== */

        window.addEventListener(
            "scroll",
            function () {

                if (window.scrollY > 30) {

                    siteHeader.classList.add(
                        "scrolled"
                    );

                } else {

                    siteHeader.classList.remove(
                        "scrolled"
                    );

                }

            }
        );



        /* =====================================================
           MOBILE MENU TOGGLE
        ====================================================== */

        menuToggle.addEventListener(
            "click",
            function () {

                const isOpen =
                    mainNav.classList.toggle("open");


                menuToggle.classList.toggle(
                    "active"
                );


                menuToggle.setAttribute(
                    "aria-expanded",
                    isOpen
                );

            }
        );



        /* =====================================================
           CLOSE MOBILE MENU AFTER CLICK
        ====================================================== */

        document
            .querySelectorAll(".nav-link")
            .forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            mainNav.classList.remove(
                                "open"
                            );


                            menuToggle.classList.remove(
                                "active"
                            );


                            menuToggle.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }
                    );

                }
            );



        /* =====================================================
           ACTIVE NAVIGATION
        ====================================================== */

        const navLinks =
            document.querySelectorAll(".nav-link");


        navLinks.forEach(
            function (link) {

                link.addEventListener(
                    "click",
                    function () {

                        navLinks.forEach(
                            function (item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


    </script>


</body>

</html>
